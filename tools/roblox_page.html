<!doctype html>
<!-- Built by tools/build_roblox_page.py from roblox-security/source/. Edit those files, not index.html. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#222222">
<link rel="canonical" href="https://zainsplace.github.io/roblox-security/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zainsplace.github.io/roblox-security/">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta name="twitter:card" content="summary">
<style>
:root {
  --bg: #222222;
  --bar: #1a1a1a;
  --card: #2a2a2a;
  --line: #3b3b3b;
  --text: #e4e4e4;
  --muted: #9c9c9c;
  --link: #5aa9ff;
  --crit: #ff6b6b;
  --high: #f0a93b;
  --ok: #4cc38a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
/* Links inside running text need more than colour to stand out (link blue is 1.9:1 against body text). */
.what a, .contact a { text-decoration: underline; text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }
code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.9em; background: #171717; border: 1px solid var(--line); border-radius: 4px; padding: 0.1em 0.35em; overflow-wrap: anywhere; }

.bar { background: var(--bar); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 58rem; margin: 0 auto; padding: 0.8rem 1rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
.bar .brand { font-weight: 600; color: var(--text); }
.bar nav { display: flex; gap: 1.25rem; margin-left: auto; }
.bar nav a { color: var(--muted); }
.bar nav a:hover { color: var(--text); text-decoration: none; }

.page { max-width: 58rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
.title h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.6rem; font-weight: 600; }
.crumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem; color: var(--muted); font-size: 0.9rem; }
.cat { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text); }
.cat::before { content: ""; width: 0.7rem; height: 0.7rem; background: var(--link); display: inline-block; border-radius: 2px; }
.tag { background: #333; border-radius: 4px; padding: 0.05rem 0.5rem; color: var(--muted); font-size: 0.85rem; }

.post { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr); gap: 0.9rem; padding: 1.1rem 0; border-top: 1px solid var(--line); }
.avatar { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: #3a4a63; color: #fff; display: grid; place-items: center; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 0.2rem 0.75rem; align-items: baseline; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.4rem; }
.meta strong { color: var(--text); }
.meta .role { background: #333; border-radius: 4px; padding: 0 0.4rem; font-size: 0.8rem; }
.meta .when { margin-left: auto; }
.what h2 { font-size: 1.25rem; line-height: 1.3; margin: 0.2rem 0 0.8rem; font-weight: 600; }
.what p { margin: 0 0 0.9rem; max-width: 46rem; }
.what ol { margin: 0; padding-left: 1.3rem; max-width: 46rem; }
.what li { margin-bottom: 0.45rem; }

.facts { margin: 0; display: grid; grid-template-columns: 9.5rem 1fr; gap: 0.55rem 1rem; max-width: 46rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }

.tablewrap { overflow-x: auto; }
.tablewrap:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }
table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 0.9rem; }
tr:last-child td { border-bottom: 0; }

.chip { display: inline-block; font-size: 0.75rem; font-weight: 600; line-height: 1; padding: 0.28rem 0.5rem; border-radius: 999px; border: 1px solid currentColor; vertical-align: middle; white-space: nowrap; }
.sev-critical { color: var(--crit); }
.sev-high { color: var(--high); }
.ok { color: var(--ok); }

.contact { margin-top: 1rem; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 1rem 1.1rem; }
.contact p { margin: 0; }

@media (max-width: 40rem) {
  .post { grid-template-columns: minmax(0, 1fr); }
  .who { display: none; }
  .facts { grid-template-columns: 1fr; gap: 0; }
  .facts dd { margin-bottom: 0.7rem; }
  .meta .when { margin-left: 0; }
  /* The summary table must fit a 320px screen: tighter cells, and chips may wrap. */
  th, td { padding: 0.5rem 0.45rem; }
  .tablewrap .chip { white-space: normal; text-align: center; }
}
@media (max-width: 22rem) {
  th, td { padding: 0.45rem 0.3rem; }
  .tablewrap .chip { padding: 0.25rem 0.35rem; }
}
</style>
</head>
<body>
<header class="bar"><div class="in">
<a class="brand" href="/roblox-security/">Game security reviews</a>
<nav aria-label="Site"><a href="/">Portfolio</a><a href="#summary">Summary</a><a href="#recommendations">Recommendations</a></nav>
</div></header>

<main class="page">
<div class="title">
<h1>{{heading}}</h1>
<div class="crumbs">{{crumbs}}</div>
</div>

{{posts}}

<div class="contact"><p>{{contact}}</p></div>
</main>
</body>
</html>
