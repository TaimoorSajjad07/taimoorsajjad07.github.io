<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 2 Cyber Security Revision</title>
  <meta name="description" content="Revision hub for BTEC National Unit 2: Cyber Security & Incident Management — flashcards with spaced repetition, exam-style questions, model answers, games and progress tracking.">
  <meta name="theme-color" content="#4338CA">
  <meta property="og:title" content="Unit 2 Cyber Security Revision">
  <meta property="og:description" content="Flashcards, exam questions, battles and progress tracking for BTEC Unit 2: Cyber Security & Incident Management.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%234338CA'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- Sidebar backdrop (mobile only) -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-wordmark">
      <span class="sidebar-icon-mark">U2</span>
      <span class="sidebar-logo-text">Unit 2 Cyber</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <button class="sidebar-btn" data-page="home"       onclick="sidebarNav('home')"><i data-lucide="home"></i><span>Home</span></button>
    <button class="sidebar-btn" data-page="sections"   onclick="sidebarNav('sections')"><i data-lucide="book-open"></i><span>Sections</span></button>
    <button class="sidebar-btn" data-page="flashcards" onclick="sidebarNav('flashcards')"><i data-lucide="layers"></i><span>Flashcards</span></button>
    <button class="sidebar-btn" data-page="questions"  onclick="sidebarNav('questions')"><i data-lucide="help-circle"></i><span>Questions</span></button>
    <button class="sidebar-btn" data-page="games"      onclick="sidebarNav('games')"><i data-lucide="zap"></i><span>Games</span></button>
    <button class="sidebar-btn" data-page="leaderboard" onclick="sidebarNav('leaderboard')"><i data-lucide="trophy"></i><span>Leaderboard</span></button>
    <button class="sidebar-btn" data-page="extended"   onclick="sidebarNav('extended')"><i data-lucide="pencil"></i><span>Extended</span></button>
    <button class="sidebar-btn" data-page="examkit"    onclick="sidebarNav('examkit')"><i data-lucide="clipboard-list"></i><span>Exam Kit</span></button>
    <button class="sidebar-btn" data-page="search"     onclick="sidebarNav('search')"><i data-lucide="search"></i><span>Search</span></button>
    <button class="sidebar-btn" data-page="plan"       onclick="sidebarNav('plan')"><i data-lucide="calendar"></i><span>Plan</span></button>
    <button class="sidebar-btn" data-page="profile"    onclick="sidebarNav('profile')"><i data-lucide="user"></i><span>Profile</span></button>
  </nav>
  <div class="sidebar-bottom">
    <button class="sidebar-av-btn" id="sidebar-avatar" onclick="sidebarNav('profile')" title="Your profile">
      <span class="sidebar-av-circle" id="sidebar-av-circle">Z</span>
      <span class="sidebar-av-label">Profile</span>
    </button>
  </div>
</aside>

<!-- App shell wraps top-bar + main -->
<div class="app-shell">

<header class="top-bar">
  <button class="top-bar-menu" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
    <i data-lucide="menu"></i>
  </button>
  <span class="top-bar-title" id="top-bar-title">Home</span>
  <div class="top-bar-right">
    <button class="theme-toggle top-bar-theme-btn" id="top-bar-theme" onclick="toggleTheme()" title="Switch to dark mode">🌙</button>
    <button class="top-bar-avatar" id="nav-avatar" onclick="sidebarNav('profile')" title="Your profile">Z</button>
  </div>
</header>

<main>

  <!-- HOME -->
  <div class="page" id="page-home">
    <div class="dash-header">
      <div class="dash-header-info">
        <p class="dash-greeting" id="home-greeting">Good morning</p>
        <h2 class="dash-title">Unit 2 Cyber Security</h2>
        <p class="dash-sub">BTEC National · Cyber Security &amp; Incident Management</p>
      </div>
      <button class="countdown-pill" onclick="setExamDate()" title="Click to set your exam date">
        <span class="countdown-days" id="home-countdown-days">--</span>
        <span class="countdown-label" id="home-countdown-label">days to exam</span>
        <span class="countdown-date" id="home-countdown-date"></span>
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="num" style="color:var(--green)" id="home-stat-green">0</div>
        <div class="lbl">Confident</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--amber)" id="home-stat-amber">0</div>
        <div class="lbl">Getting there</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--red)" id="home-stat-red">0</div>
        <div class="lbl">Need work</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--accent2)" id="home-stat-streak">0</div>
        <div class="lbl">Day streak</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--amber)" id="home-flash-due">0</div>
        <div class="lbl">Cards due</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--pink)" id="home-stat-level">L1</div>
        <div class="lbl" id="home-stat-xp">0/250 XP</div>
      </div>
    </div>

    <div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px">
        <span>Overall confidence</span>
        <span id="home-overall-pct">0%</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="home-overall-progress" style="width:0%"></div>
      </div>
    </div>

    <div class="action-deck">
      <button class="action-hero" onclick="navigate('sections', {section:'A'})">
        <span class="action-hero-kicker">Continue revising</span>
        <span class="action-hero-title">Start Section A</span>
        <span class="action-hero-sub">Threats, vulnerabilities &amp; protection</span>
        <span class="action-hero-arrow">→</span>
      </button>
      <div class="action-index">
        <button class="action-row" onclick="navigate('flashcards')">
          <span class="action-num">01</span><span class="action-label">Flashcards</span><span class="action-arrow">→</span>
        </button>
        <button class="action-row" onclick="navigate('questions')">
          <span class="action-num">02</span><span class="action-label">Practice questions</span><span class="action-arrow">→</span>
        </button>
        <button class="action-row" onclick="navigate('games')">
          <span class="action-num">03</span><span class="action-label">Games &amp; battles</span><span class="action-arrow">→</span>
        </button>
        <button class="action-row" onclick="navigate('plan')">
          <span class="action-num">04</span><span class="action-label">Today's plan</span><span class="action-arrow">→</span>
        </button>
      </div>
    </div>

    <div id="revise-next"></div>

    <div id="priority-topics"></div>

    <div id="activity-heatmap" style="margin-bottom:24px"></div>

    <h3 style="margin-bottom:12px;font-size:14px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px">Sections</h3>
    <div class="grid2" id="section-tiles"></div>
  </div>

  <!-- SECTIONS -->
  <div class="page" id="page-sections">
    <div id="sections-content"></div>
  </div>

  <!-- FLASHCARDS -->
  <div class="page" id="page-flashcards">
    <div id="flashcards-content"></div>
  </div>

  <!-- QUESTIONS -->
  <div class="page" id="page-questions">
    <div id="questions-content"></div>
  </div>

  <!-- GAMES -->
  <div class="page" id="page-games">
    <div id="games-content"></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="page" id="page-leaderboard">
    <div id="leaderboard-content"></div>
  </div>

  <!-- EXTENDED RESPONSE -->
  <div class="page" id="page-extended">
    <div id="extended-content"></div>
  </div>

  <!-- EXAM KIT -->
  <div class="page" id="page-examkit">
    <div id="examkit-content"></div>
  </div>

  <!-- SEARCH -->
  <div class="page" id="page-search">
    <div id="search-content"></div>
  </div>

  <!-- PLAN -->
  <div class="page" id="page-plan">
    <div id="plan-content"></div>
  </div>

  <!-- PROFILE -->
  <div class="page" id="page-profile">
    <div id="profile-content"></div>
  </div>

</main>

</div><!-- /.app-shell -->

<div class="modal-overlay" id="player-modal-overlay" onclick="if(event.target===this)closePlayerCard()">
  <div class="modal" id="player-modal"></div>
</div>

<div id="toast" role="status" aria-live="polite">
  <span id="toast-icon"></span>
  <span id="toast-msg"></span>
  <div id="toast-bar"></div>
</div>

<script src="data_inline.js"></script>
<script src="app.js"></script>
</body>
</html>
