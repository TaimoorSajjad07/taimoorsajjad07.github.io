<html lang="en-GB">

    :root { --bg: #F5F1E8; --card: #FFFCF6; --text: #2A251F; --text2: #6A6155; --accent: #1B5A5F; --border: #DED7C7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1A1714; --card: #221E19; --text: #EDE6DA; --text2: #A2988A; --accent: #6FB3B8; --border: #3A342C; }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; text-align: center; background: var(--card); border: 1px solid var(--border);
           border-radius: 8px; padding: 32px 24px; }

    p { color: var(--text2); line-height: 1.5; margin: 0 0 20px; }
    a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700;
        padding: 12px 20px; border-radius: 999px; min-height: 44px; }
